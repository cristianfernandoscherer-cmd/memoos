server:
  mcp:
    enabled: true
    tool_timeout: 30
    max_request_size: 10485760 

database:
  path: ""  
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 300 

embed:
  onnx_path: "assets/models/all-MiniLM-L6-v2"
  onnx_model: all-MiniLM-L6-v2
  max_seq_len: 256 

logging:
  level: info  
  format: json  
  output: stderr  
  file_path: ""  

projects:
  auto_create: true
  default_categories:
    - architecture
    - payments
    - infra
    - business
    - bugs
    - conventions
    - docs
    - sessions
    - general
  path_cache: true
  cache_ttl: 3600  
